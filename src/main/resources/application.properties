spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:openai/gpt-oss-20b}

# Groq no soporta audio/imágenes — apagamos esos modelos para que Spring AI
# no intente autoconfigurar OpenAiAudioSpeechModel y falle sin la key de audio.
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.embedding=none
spring.ai.model.moderation=none

# LLM disabled by default; enable with the "llm" Spring profile
spring.ai.model.chat=none

# Risk gates
trading.risk.max-account-risk=${RISK_MAX_ACCOUNT_RISK:0.02}
trading.risk.max-daily-operations=${RISK_MAX_DAILY_OPERATIONS:5}
trading.risk.min-days-to-expiration=${RISK_MIN_DAYS_TO_EXPIRATION:14}
trading.risk.max-days-to-expiration=${RISK_MAX_DAYS_TO_EXPIRATION:28}
trading.risk.max-option-loss-ratio=${RISK_MAX_OPTION_LOSS_RATIO:0.30}

# Actuator health endpoint for Render
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoint.health.show-details=never
