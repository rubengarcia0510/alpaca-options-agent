spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:openai/gpt-oss-20b}

# Groq no soporta audio/imágenes — apagamos esos modelos para que Spring AI
# no intente autoconfigurar OpenAiAudioSpeechModel y falle sin la key de audio.
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.embedding=none
spring.ai.model.moderation=none

# LLM disabled by default; enable with the "llm" Spring profile
spring.ai.model.chat=none
